[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-preserver"
version = "0.1.0"
description = "Preserve, package, and verify file metadata across copy, download, and conversion workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "NorD" }]
keywords = ["metadata", "xattr", "exif", "preservation", "file-integrity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
metakeep = "metakeep.cli:main"

[tool.setuptools.packages.find]
include = ["metakeep*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
